name: frontend parity (frozen subset)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/ir/**'
      - 'benchmarks/frontend-parity/**'
      - 'src/frontend/**'
  pull_request:
    paths:
      - 'src/ir/**'
      - 'benchmarks/frontend-parity/**'
      - 'src/frontend/**'

permissions:
  contents: read

concurrency:
  group: frontend-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Toolchain versions
        shell: pwsh
        run: |
          python --version
          rustc --version
          cargo --version

      - name: Build Rust frontend
        shell: pwsh
        run: cargo build --release --manifest-path src/frontend/Cargo.toml

      - name: Frozen parity (SPEC.md)
        shell: pwsh
        run: python benchmarks/frontend-parity/tools/bench.py --runs 1 --warmup 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-parity-results
          path: |
            benchmarks/frontend-parity/results/SUMMARY.md
            benchmarks/frontend-parity/results/benchmark.json