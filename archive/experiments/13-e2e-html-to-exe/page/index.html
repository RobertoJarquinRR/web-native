<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="root">
      <div class="topbar">
        <div class="dots">
          <div class="dot dot-a"></div>
          <div class="dot dot-b"></div>
          <div class="dot dot-c"></div>
        </div>
        <div class="pill"></div>
      </div>

      <div class="cards">
        <div class="card">
          <div class="accent accent-a"></div>
          <div class="line line-1"></div>
          <div class="line line-2"></div>
          <div class="line line-3"></div>
        </div>
        <div class="card">
          <div class="accent accent-b"></div>
          <div class="line line-1"></div>
          <div class="line line-2b"></div>
          <div class="line line-3"></div>
        </div>
        <div class="card">
          <div class="accent accent-c"></div>
          <div class="line line-1"></div>
          <div class="line line-2c"></div>
          <div class="line line-3"></div>
        </div>
      </div>

      <div class="footer">
        <div class="footer-bar"></div>
      </div>
    </div>
  </body>
</html>
