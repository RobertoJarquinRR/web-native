<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>webnative static flex/grid z-index fixture</title>
  <link rel="stylesheet" href="zitem.css">
</head>
<body>
  <!-- Static flex items with z-index: the second item overlaps the first with a
       negative margin. z 2 must paint above z 1, and the swapped row must keep
       the DOM first item on top. -->
  <div id="row1" class="row">
    <div id="a1" class="a1"></div>
    <div id="a2" class="a2"></div>
  </div>
  <div id="row2" class="row">
    <div id="b1" class="b1"></div>
    <div id="b2" class="b2"></div>
  </div>
  <!-- Static grid item with z 2 over an earlier z 1 item. -->
  <div id="grid" class="grid">
    <div id="g1" class="g1"></div>
    <div id="g2" class="g2"></div>
  </div>
  <!-- A z 100 relative child is trapped inside the z 1 static flex item, so the
       sibling z 2 item stays on top. -->
  <div id="row3" class="row">
    <div id="nest" class="nest">
      <div id="deep" class="deep"></div>
    </div>
    <div id="top" class="top"></div>
  </div>
</body>
</html>
