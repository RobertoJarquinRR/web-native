<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>webnative position fixture</title>
  <link rel="stylesheet" href="position.css">
</head>
<body>
  <!-- Relative boxes stay in flow and shift; absolute boxes leave the flow,
       resolve against the nearest positioned ancestor (or body) and keep tree
       paint order. -->
  <div class="flow"></div>
  <div class="rel"></div>
  <div class="rel2"></div>
  <div class="abs"></div>
  <div class="after"></div>
  <div class="absstretch"></div>
  <div class="abspct"></div>
  <div class="nested-host"><div class="nested"></div></div>
  <!-- F1 regression: the absolute escapes a static ancestor whose content box
       is fully clipped (height:0 + overflow:hidden), so the paint walk must
       not prune the subtree at that empty clip. -->
  <div class="escape-host"><div class="escape-mid"><div class="escape"></div></div></div>
</body>
</html>
