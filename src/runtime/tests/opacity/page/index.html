<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>webnative group opacity fixture</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Row 1: a 0.5 group with two overlapping children (the overlap must be
       composited once), and a 0.5 group nested inside another 0.5 group. -->
  <div class="row first">
    <div id="overlap" class="group">
      <div id="over-a" class="over-a"></div>
      <div id="over-b" class="over-b"></div>
    </div>
    <div id="nested" class="group nested">
      <div id="inner" class="inner">
        <div id="fill" class="fill"></div>
      </div>
    </div>
  </div>

  <!-- Row 2: leaves. A single primitive has nothing to overlap, so its own
       geometry alpha carries the 0.5 exactly. -->
  <div class="row second">
    <div id="leaf-solid" class="leaf-solid"></div>
    <div id="leaf-text" class="leaf-text">H</div>
    <img id="leaf-image" class="leaf-image" src="poster.png" alt="poster">
  </div>

  <!-- Row 3: opacity: 0 renders nothing. -->
  <div class="row third">
    <div id="zero" class="group zero">
      <div id="zero-a" class="zero-a"></div>
      <div id="zero-b" class="zero-b"></div>
    </div>
  </div>
</body>
</html>
