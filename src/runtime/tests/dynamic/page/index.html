<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>webnative dynamic fixture</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="root">
  <div class="toolbar">
    <div class="title">Dynamic</div>
    <div class="badge"></div>
  </div>
  <div class="cards">
    <div class="card" data-selected="#3498db" data-action="select">
      <img class="thumb" src="images/a.png" alt="A">
      <div class="label">Alpha</div>
    </div>
    <div class="card" data-selected="#3498db" data-action="select">
      <img class="thumb" src="images/b.png" alt="B">
      <div class="label">Beta</div>
    </div>
  </div>
  <div class="footer">
    <div class="hint">Clone</div>
  </div>
</body>
</html>
